name: Build Gradle

on:
  push:
    branches:
      - 'support/fidorial'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'master'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run build and tests with Gradle wrapper
        run: ./gradlew build -x test

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          annotate_notice: true
          detailed_summary: true

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            standalone/loader/build/libs/LuckPerms-Standalone-*.jar
            fidorial/loader/build/libs/LuckPerms-Fidorial-*.jar

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-binary
          path: standalone/loader/build/libs/LuckPerms-Standalone-*.jar
